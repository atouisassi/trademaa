<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcule Trade Maa</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.2/dist/xlsx.full.min.js"></script>

</head>
<body>
<div class="container">
    <div class="text">Calcule Trade Maa</div>
    <form name="formulaire" onsubmit="return false;">
        <div class="form-row">
            <div class="input-data"><label>FOB ($)</label><input type="number" name="fob" step="0.01" required></div>
            <div class="input-data"><label>PCB</label><input type="number" name="pcb" required></div>
            <div class="input-data"><label>CBM</label><input type="number" name="cbm" step="0.00001" required></div>
        </div>
        <div class="form-row">
            <div class="input-data"><label>Maritime (€)</label><input type="number" name="maritime" value="2500" required></div>
            <div class="input-data"><label>Tracking (€)</label><input type="number" name="tracking" value="1400" required></div>
            <div class="input-data"><label>Douane (%)</label><input type="number" name="douane" value="6.5" step="0.01" required></div>
        </div>

        <div class="submit-btns">
            <input type="button" value="📊 Calculer" onclick="calc(true)">
            <input type="button" id="addBtn" value="➕ Ajouter" onclick="toggleInfoBox(true)">
            <input type="button" value="🧹 Vider" onclick="resetForm(); toggleInfoBox(false);">
            <input type="button" value="📤 Exporter" onclick="exportXLSXOrCSV2()">
        </div>

        <div id="infoBox" class="hidden-box">
            <div class="input-data"><label>Référence</label>
                <input id="refInput" type="text" style="text-transform:uppercase;" autocorrect="off" autocapitalize="characters" placeholder="Ex: REF001"></div>
            <div class="input-data"><label>Description</label><textarea id="descInput" placeholder="Description ou remarque..."></textarea></div>
            <div class="input-data"><label>Photo (caméra ou fichier)</label>
                <input id="photoInput" type="file" accept="image/*" capture="environment" onchange="handlePhotoUpload(event)"></div>
            <input type="button" style="margin-top:8px" value="💾 Enregistrer la ligne" onclick="ajouter();toggleInfoBox(false);">
        </div>
    </form>

    <div id="result" class="results"></div>

    <div class="table-zone">
        <h3 style="text-align:center;margin-top:15px;">📋 Tableau </h3>
        <button class="clear-btn" onclick="clearStorage()">🗑️ Effacer les données sauvegardées</button>
        <table>
            <thead>
                <tr>
                    <th>#</th><th>Réf.</th><th>Description</th>
                    <th>FOB</th><th>PCB</th><th>CBM</th><th>Prix 2025</th><th>Prix vente</th><th>Photo</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="table-body"><tr><td colspan="11">Aucune simulation.</td></tr></tbody>
        </table>
    </div>
</div>

<script>
let dataList=[], selectedIndex=null;

window.onload = function(){
    const saved = localStorage.getItem("tradeMaaData");
    if(saved){dataList = JSON.parse(saved);}
    renderTable();
};

function saveData(){localStorage.setItem("tradeMaaData", JSON.stringify(dataList));}

// --- Calcul ---
function calc(show=false){
    const f = document.formulaire;
    const pcb = parseFloat(f.pcb.value);
    const cbm = parseFloat(f.cbm.value);
    const fob = parseFloat(f.fob.value);
    const maritime = parseFloat(f.maritime.value);
    const douane = parseFloat(f.douane.value)/100;
    const tracking = parseFloat(f.tracking.value);
    if([pcb,cbm,fob,maritime,douane,tracking].some(isNaN)){alert("Champs invalides");return false;}
    let pr=((56/cbm)*pcb*fob)+maritime;
    pr=pr*(1+douane)+tracking;
    pr/=((56/cbm)*pcb);
    const mcmp=pr/0.88, log=pr*0.15, pv=log+mcmp, rfa=pv*0.06, pvrfa=pv+rfa;
    const pnew = (pvrfa/1).toFixed(2);
    const pvp = Math.ceil((pvrfa*2)*2)/2-0.01;
    if(show){
        document.getElementById("result").innerHTML = `
            <hr><strong>💶 Prix 2025 : ${pnew} €</strong><br>
            ${pr.toFixed(3)} : P.Brute | ${mcmp.toFixed(3)} : CMP | ${log.toFixed(3)} : Log +15%<br>
            ${rfa.toFixed(3)} : RFA | ${pv.toFixed(3)} : P.sans RFA<br>
            <strong>🏷️ Prix vente (x2) : ${pvp.toFixed(2)} €</strong><hr>`;
    }
    return {pr,mcmp,log,pv,rfa,pvrfa,pnew,pvp};
}

function toggleInfoBox(show = true){ 
    const box=document.getElementById("infoBox");
    box.style.display=(show)?"block":"none";
}

// --- Ajouter / éditer ligne ---
function ajouter(){
    const result = calc(true);
    if(!result) return;
    const ref = (document.getElementById("refInput").value || "SANS REFERENCE").toUpperCase();
    const desc = document.getElementById("descInput").value || "Sans description";
    const photo = document.getElementById("photoInput").dataset.base64 || "";
    const now = new Date();
    const dateStr = now.toLocaleDateString()+" "+now.toLocaleTimeString();
    const f = document.formulaire;
    const entry = {ref, description:desc, date:dateStr, photo,
        fob:f.fob.value, pcb:f.pcb.value, cbm:f.cbm.value,
        maritime:f.maritime.value, tracking:f.tracking.value, douane:f.douane.value,
        ...result};
    if(selectedIndex !== null){
        dataList[selectedIndex] = entry;
        selectedIndex = null;
        document.getElementById("addBtn").value="➕ Ajouter";
    } else { dataList.push(entry); }
    saveData();
    renderTable();
    resetForm();
}

// --- Photo upload ---
function handlePhotoUpload(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        event.target.dataset.base64 = e.target.result;
    };
    reader.readAsDataURL(file);
}

// --- Tableau ---
function renderTable(){
    const tbody = document.getElementById("table-body");
    if(dataList.length===0){tbody.innerHTML='<tr><td colspan="11">Aucune simulation.</td></tr>'; return;}
    tbody.innerHTML = dataList.map((it,i)=>`
        <tr class="${selectedIndex===i?'selected':''}">
            <td>${i+1}</td>
            <td class="editable" contenteditable onblur="updateRef(${i},this.innerText)">${it.ref}</td>
            <td class="editable" contenteditable onblur="updateDescription(${i},this.innerText)">${it.description}</td>
            <td>${it.fob}</td><td>${it.pcb}</td><td>${it.cbm}</td>
            <td>${it.pnew} €</td><td>${it.pvp.toFixed(2)} €</td>
            <td>${it.photo ? `<img src="${it.photo}" onclick="openPhoto('${it.photo}')">` : '—'}</td>
            <td>
                <button class="action-btn" onclick="editRow(event,${i})">✏️</button>
                <button class="action-btn" onclick="deleteRow(event,${i})">🗑️</button>
            </td>
        </tr>`).join("");
}
function updateDescription(i,text){dataList[i].description=text.trim()||"Sans description"; saveData();}
function updateRef(i,text){dataList[i].ref=text.trim().toUpperCase()||"SANS REFERENCE"; saveData();}
function editRow(e,i){
    e.stopPropagation();
    const it=dataList[i];
    const f=document.formulaire;
    f.fob.value=it.fob; f.pcb.value=it.pcb; f.cbm.value=it.cbm;
    f.maritime.value=it.maritime; f.tracking.value=it.tracking; f.douane.value=it.douane;
    document.getElementById("refInput").value=it.ref;
    document.getElementById("descInput").value=it.description;
    selectedIndex=i;
    document.getElementById("addBtn").value="💾 Mettre à jour";
    document.getElementById("infoBox").style.display="block";
    renderTable();
}
function deleteRow(e,i){ e.stopPropagation(); if(confirm("Supprimer cette ligne ?")){ dataList.splice(i,1); selectedIndex=null; document.getElementById("addBtn").value="➕ Ajouter"; saveData(); renderTable(); } }
function resetForm(){
    const f=document.formulaire;
    f.reset();
    document.getElementById("result").innerHTML="";
    document.getElementById("refInput").value="";
    document.getElementById("descInput").value="";
    document.getElementById("photoInput").value="";
    delete document.getElementById("photoInput").dataset.base64;
    selectedIndex=null;
    document.getElementById("addBtn").value="➕ Ajouter";
}

// --- Export XLSX + fallback CSV ---
    async function exportXLSXOrCSV2() {
  if (dataList.length === 0) {
    alert("Aucune donnée à exporter.");
    return;
  }

  try {
    const resp = await fetch("https://backend-k01c.onrender.com/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ data: dataList })
    });

    if (!resp.ok) throw new Error(await resp.text());
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Simulations_TradeMaa.xlsx";
    a.click();
    URL.revokeObjectURL(url);

  } catch (err) {
    console.error(err);
    alert("Erreur d’export : " + err.message);
  }
}

// Utilitaire : charge la lib XLSX à la volée si nécessaire
function ensureXLSX() {
  if (typeof XLSX !== 'undefined') return Promise.resolve(true);
  // URL fiable jsDelivr (tu peux remplacer si tu as une autre préférence)
  const url = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.async = true;
    s.onload = () => {
      // petite attente pour être sûr que l'objet est prêt
      setTimeout(() => (typeof XLSX !== 'undefined' ? resolve(true) : reject(new Error('XLSX introuvable après chargement'))), 50);
    };
    s.onerror = (e) => reject(new Error('Échec chargement XLSX: ' + e.message));
    document.head.appendChild(s);
  });
}

function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }

// Version robuste d'export avec chargement dynamique + fallback CSV
async function exportXLSXOrCSV() {
  if (dataList.length === 0) { alert("Aucune donnée à exporter."); return; }

  if (isIOS()) {
    // iOS -> fallback CSV (XLSX non fiable)
    alert("XLSX non supporté sur iOS. Génération CSV.");
    return exportCSV();
  }

  // Essayer de charger XLSX si nécessaire
  try {
    await ensureXLSX();
  } catch (err) {
    console.warn("Impossible de charger XLSX:", err);
    alert("La bibliothèque XLSX n'a pas pu être chargée. Export CSV utilisé.");
    return exportCSV();
  }

  // À partir d'ici, XLSX doit être disponible
  try {
    const wsData = [["#","Date","Réf.","Description","FOB","PCB","CBM","Maritime","Tracking","Douane","P.brut","Marge CMP","Log +15%","PV","RFA","Prix trade","Prix Vente","Photo"]];
    for (let i=0;i<dataList.length;i++){
      const it = dataList[i];
      let photoCell = "";
      if (it.photo) {
        // créer miniature via canvas (50x50)
        const img = new Image();
        img.src = it.photo;
        await new Promise(res => { img.onload = res; img.onerror = res; });
        const canvas = document.createElement('canvas');
        const maxSize = 200; // taille maximale du côté le plus long
        const ctx = canvas.getContext('2d');
        
        if (img.naturalWidth && img.naturalHeight) {
            // Calcul du scale pour que le côté le plus long = maxSize
            const scale = Math.min(maxSize / img.naturalWidth, maxSize / img.naturalHeight, 1);
            const w = img.naturalWidth * scale;
            const h = img.naturalHeight * scale;
            canvas.width = w;
            canvas.height = h;
            
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
        
            // Conversion en base64 pour Excel
            photoCell = canvas.toDataURL('image/png');
        }
      }

      // Assure-toi que les champs calculés existent ; si non, recalculer
      const pr = (it.pr !== undefined) ? parseFloat(it.pr) : NaN;
      const mcmp = (it.mcmp !== undefined) ? parseFloat(it.mcmp) : NaN;
      const log = (it.log !== undefined) ? parseFloat(it.log) : NaN;
      const pv = (it.pv !== undefined) ? parseFloat(it.pv) : NaN;
      const rfa = (it.rfa !== undefined) ? parseFloat(it.rfa) : NaN;
      const pvrfa = (it.pvrfa !== undefined) ? parseFloat(it.pvrfa) : NaN;
      const pnew = (it.pnew !== undefined) ? it.pnew : "";
      const pvp = (it.pvp !== undefined) ? it.pvp : "";

      wsData.push([
        i+1,
        it.date || "",
        it.ref || "",
        it.description || "",
        it.fob || "",
        it.pcb || "",
        it.cbm || "",
        it.maritime || "",
        it.tracking || "",
        it.douane || "",
        isFinite(pr) ? pr.toFixed(3) : "",
        isFinite(mcmp) ? mcmp.toFixed(3) : "",
        isFinite(log) ? log.toFixed(3) : "",
        isFinite(pv) ? pv.toFixed(3) : "",
        isFinite(rfa) ? rfa.toFixed(3) : "",
        isFinite(pvrfa) ? pvrfa.toFixed(3) : "",
        pnew !== "" ? pnew : "",
        pvp !== "" ? (typeof pvp === 'number' ? pvp.toFixed(2) : pvp) : "",
        photoCell
      ]);
    }

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    // Ajuste largeur colonnes (ajuste index de photo à la fin)
    ws['!cols'] = wsData[0].map((_, idx) => (idx === wsData[0].length-1 ? { wpx: 70 } : { wpx: 90 }));
    XLSX.utils.book_append_sheet(wb, ws, "Simulations");
    // Crée un tableau d'images
        const images = [];
        for (let i = 1; i < wsData.length; i++) { // sauter l'entête
          const imgBase64 = wsData[i][wsData[0].length - 1];
          if (imgBase64) {
            images.push({
              name: `photo_${i}.png`,
              data: imgBase64.split(',')[1], // retire le "data:image/png;base64,"
              extension: ".png",
              position: {
                type: "twoCellAnchor",
                attrs: { editAs: "oneCell" },
                from: { col: wsData[0].length - 1, row: i, colOff: 0, rowOff: 0 },
                to: { col: wsData[0].length, row: i + 1 }
              }
            });
          }
    }
    
    // Attache les images à la feuille
    if (images.length) ws["!images"] = images;
    // Télécharger fichier
    XLSX.writeFile(wb, "Simulations_TradeMaa.xlsx");
  } catch (err) {
    console.error("Erreur lors de l'export XLSX:", err);
    alert("Erreur lors de la génération XLSX. Export CSV utilisé en secours.");
    exportCSV();
  }
}

function exportCSV(){
    if(dataList.length===0){alert("Aucune donnée à exporter."); return;}
    const headers=["#","Date","Réf.","Description","FOB","PCB","CBM","Maritime","Tracking","Douane","P.brut","Marge CMP","Log +15%","PV","RFA","Prix trade","Prix Vente","Photo"];
    const rows = dataList.map((it,i)=>[
        i+1,it.date,it.ref,it.description,it.fob,it.pcb,it.cbm,
        it.maritime,it.tracking,it.douane,
        it.pr.toFixed(3),
        it.mcmp.toFixed(3),
        it.log.toFixed(3),
        it.pv.toFixed(3),
        it.rfa.toFixed(3),
        it.pvrfa.toFixed(3),
        it.pvp.toFixed(2),
        it.photo||""
    ]);
    const csv = [headers.join(";"),...rows.map(r=>r.map(x=>`"${x}"`).join(";"))].join("\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download="Simulations_TradeMaa.csv"; a.click(); URL.revokeObjectURL(url);
}


// --- Photo preview ---
function openPhoto(src){window.open(src,'_blank');}
function clearStorage(){if(confirm("Effacer toutes les données sauvegardées ?")){localStorage.removeItem("tradeMaaData"); dataList=[]; renderTable();}}
</script>
</body>
</html>
