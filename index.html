<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-title" content="Trade Maa">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="favicon.png" type="image/png">
<title>Calcule Trade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="text">Calcule Trade</div>
    <form name="formulaire" onsubmit="return false;">
        <div class="form-row">
            <div class="input-data"><label>FOB ($)</label><input type="number" min="0" max ="10000" name="fob" step="0.01" required></div>
            <div class="input-data"><label>PCB</label><input type="number" min="1" max="5000" name="pcb" step ="1" required></div>
            <div class="input-data"><label>CBM</label><input type="number" min="0" max="20" name="cbm" step="0.00001" required></div>
        </div>
        <div class="form-row">
            <div class="input-data"><label>Maritime (€)</label><input type="number" name="maritime" value="2500" required></div>
            <div class="input-data"><label>Tracking (€)</label><input type="number" name="tracking" value="1400" required></div>
            <div class="input-data"><label>Douane (%)</label><input type="number" min="0" max="100" name="douane" value="6.5" step="0.01" required></div>
        </div>

        <div class="submit-btns">
            <input type="button" value="📊 Calculer" onclick="calc(true)">
            <input type="button" id="addBtn" value="➕ Ajouter" onclick="toggleInfoBox(true)">
            <input type="button" value="🧹 Vider" onclick="resetForm(); toggleInfoBox(false);">
            <input type="button" value="📤 Exporter" onclick="exportXLSXOrCSV()">
        </div>

        <div id="infoBox" class="hidden-box">
            <div class="input-data"><label>Référence</label>
                <input id="refInput" type="text" style="text-transform:uppercase;" autocorrect="off" autocapitalize="characters" placeholder="Ex: REF001"></div>
            <div class="input-data"><label>Description</label><textarea id="descInput" placeholder="Description ou remarque..."></textarea></div>
            <div class="input-data"><label>Photo (caméra ou fichier)</label>
               
            <button type="button" onclick="document.getElementById('photoInputCamera').click()">📷 Prendre une photo</button>
            <button type="button" onclick="document.getElementById('photoInputGallery').click()">🖼️ Choisir dans la galerie</button>

            <input id="photoInputCamera" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoUpload(event)">
            <input id="photoInputGallery" type="file" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
            
            <input type="button" style="margin-top:4px;padding:8px" value="💾 Enregistrer la ligne" onclick="ajouter();toggleInfoBox(false);">
        </div>
    </form>

    <div id="result" class="results"></div>

    <div class="table-zone">
        <button class="clear-btn" onclick="clearStorage()">🗑️ Effacer les données sauvegardées</button>
        <table>
            <thead>
                <tr>
                    <th>#</th><th>Réf.</th><th>Description</th>
                    <th>FOB</th><th>PCB</th><th>CBM</th><th>Prix 2025</th><th>Prix vente</th><th>Photo</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="table-body"><tr><td colspan="11">Aucune simulation.</td></tr></tbody>
        </table>
    </div>
</div>
 

<!-- Fenêtre d'aperçu photo -->
<div id="photoPreview" style="
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,0.85);
  backdrop-filter: blur(6px);
  justify-content:center; align-items:center;
  flex-direction:column;
  z-index:9999;
">
  <button id="closePreview" style="
    position:absolute; top:20px; right:20px;
    background:rgba(255,255,255,0.2);
    border:none; color:white; font-size:24px;
    border-radius:50%; width:40px; height:40px;
    cursor:pointer;
  ">✕</button>
  
  <img id="previewImg" src="" alt="Aperçu" style="
    max-width:90%; max-height:80%;
    border-radius:12px;
    box-shadow:0 0 20px rgba(255,255,255,0.2);
    transition:transform 0.3s ease;
  ">
  <div id="zoomHint" style="color:#fff; font-size:14px; margin-top:10px; opacity:0.7;">
    🔍 Touchez pour zoomer / dézoomer
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
