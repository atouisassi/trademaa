<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcule Trade Maa Optimisé</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trade Maa">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.19.3/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
    <div class="text">Calcule Trade Maa</div>
    <form name="formulaire" id="formulaire">
        <div class="form-row">
            <div class="input-data"><label for="fob">FOB ($)</label><input type="number" id="fob" name="fob" step="0.01" required /></div>
            <div class="input-data"><label for="pcb">PCB</label><input type="number" id="pcb" name="pcb" required /></div>
            <div class="input-data"><label for="cbm">CBM</label><input type="number" id="cbm" name="cbm" step="0.00001" required /></div>
        </div>
        <div class="form-row">
            <div class="input-data"><label for="maritime">Maritime (€)</label><input type="number" id="maritime" name="maritime" value="2500" required /></div>
            <div class="input-data"><label for="tracking">Tracking (€)</label><input type="number" id="tracking" name="tracking" value="1400" required /></div>
            <div class="input-data"><label for="douane">Douane (%)</label><input type="number" id="douane" name="douane" value="6.5" step="0.01" required /></div>
        </div>
        <div class="form-row">
            <div class="submit-btn"><input type="submit" value="Calculer" /></div>
            <div class="submit-btn"><input type="button" onclick="resetForm()" value="Vider" /></div>
        </div>
        <div class="form-row">
            <div class="input-data"><label for="photo">Photo</label><input type="file" id="photo" accept="image/*" onchange="handlePhoto(event)" /></div>
        </div>
    </form>

    <div id="result" class="results"></div>

    <div class="table-container">
        <table id="tableData">
            <thead>
                <tr>
                    <th>Date</th><th>Réf</th><th>Description</th><th>FOB</th><th>PCB</th><th>CBM</th><th>Maritime</th><th>Tracking</th><th>Douane</th><th>Prix 2025</th><th>Prix Vente</th><th>Photo</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="form-row">
        <div class="submit-btn"><input type="button" value="Ajouter au tableau" onclick="addToTable()" /></div>
        <div class="submit-btn"><input type="button" value="Exporter XLSX" onclick="exportXLSXClient()" /></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
